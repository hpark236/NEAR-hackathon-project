[package]
name = "insydr-tap"
description = "Demo-only faucet: hands a fixed amount of one NEP-141 token to each account once."
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.7"

[dev-dependencies]
near-sdk = { version = "5.7", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
