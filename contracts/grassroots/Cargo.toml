[package]
name = "grassroots"
description = "Grassroots: a memecoin whose supply, treasury and rewards follow its real community (NEAR HACKATHON 2026)"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hpark236/NEAR-hackathon-project"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.7"
near-contract-standards = "5.7"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.7", features = ["unit-testing"] }
ed25519-dalek = "2"
bs58 = "0.5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
