# Publishes web/ to the gh-pages branch (which GitHub Pages serves) on every push to main that
# touches it, so the hosted coin page is always the committed one.
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: push web/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp web/index.html web/og.png "$tmp"/
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          cp "$tmp"/* .
          git add index.html og.png
          if git diff --cached --quiet; then echo "gh-pages already up to date"; exit 0; fi
          git commit -m "Publish web/ from ${GITHUB_SHA::7}"
          git push origin gh-pages
